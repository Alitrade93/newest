<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#c4b4b8">
<meta name="color-scheme" content="light">
<title>С днём рождения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>

/* ── FORCED LIGHT MODE ── */
:root {
  color-scheme: light only;
  forced-color-adjust: none;
  --ivory:  #faf7f4;
  --warm:   #fffcf9;
  --blush:  #f5e8ec;
  --dusty:  #c8929e;
  --rose:   #b06070;
  --wine:   #7a3f50;
  --ink:    #2c1f24;
  --ink2:   #4a3840;
  --muted:  #7a6268;
  --serif:  "Cormorant Garamond", Georgia, serif;
  --sans:   "Inter", -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }

body {
  height: 100%; min-height: 100svh;
  font-family: var(--sans);
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 40% 35%, #cdbec3 0%, #baadb2 100%);
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
  forced-color-adjust: none; touch-action: none;
}

/* ── CARD ── */
#card {
  position: relative;
  width:  min(calc(100vw - 20px), 400px);
  height: min(
    calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 24px),
    720px
  );
  border-radius: 18px; overflow: hidden;
  background: var(--ivory);
  box-shadow:
    0 1px 3px  rgba(28,8,14,.06),
    0 6px 20px rgba(28,8,14,.10),
    0 20px 56px rgba(28,8,14,.14),
    0 44px 110px rgba(28,8,14,.10);
  touch-action: none; -webkit-tap-highlight-color: transparent;
  animation: cardIn .9s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn {
  from { opacity:0; transform: translateY(32px) scale(.955); }
  to   { opacity:1; transform: none; }
}

/* ── PAGES ── */
#pages { position: absolute; inset: 0; }

.page {
  position: absolute; inset: 0; overflow: hidden;
  display: flex; flex-direction: column;
  will-change: transform;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}

/* Paper grain on every page */
.page::before {
  content: ""; position: absolute; inset: 0;
  z-index: 99; pointer-events: none; opacity: .026;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='.55'/%3E%3C/svg%3E");
  background-size: 180px;
}

.bg-ivory { background-color: var(--ivory); }
.bg-warm  { background-color: var(--warm);  }
.bg-blush { background-color: var(--blush); }

#card.dragging .page { transition: none !important; }

/* ── FLIP SHADOW ── */
#flip-shadow {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 200; border-radius: 18px;
  opacity: 0;
  background: linear-gradient(
    to left,
    rgba(22,4,10,.28) 0%, rgba(22,4,10,.10) 14%, transparent 44%
  );
}

/* ── NAV ── */
.nav-tap {
  position: absolute; top: 0; bottom: 0; width: 32%;
  z-index: 110; cursor: pointer;
}
#nav-prev { left: 0; }
#nav-next { right: 0; }

.nav-arr {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom,0px) + 14px);
  z-index: 120; pointer-events: none;
  font-family: var(--sans); font-size: 11px; font-weight: 300;
  letter-spacing: .06em; color: rgba(122,98,104,.44);
  transition: opacity .38s ease;
}
#arr-prev { left: 20px; }
#arr-next { right: 20px; }

/* Page dots */
#dots {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom,0px) + 16px);
  left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; align-items: center;
  z-index: 120;
}
.dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--muted); opacity: .2;
  cursor: pointer;
  transition: opacity .3s ease, transform .3s cubic-bezier(.16,1,.3,1);
}
.dot.active { opacity: .55; transform: scale(1.5); }
.dot:active  { transform: scale(2); }

/* Swipe hint */
#hint {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom,0px) + 38px);
  left: 50%; right: auto;
  transform: translateX(-50%);
  z-index: 121;
  pointer-events: none;
  font-family: var(--sans); font-size: 10px; font-weight: 300;
  letter-spacing: .13em; color: rgba(122,98,104,.46);
  transition: opacity .5s ease;
}
#hint.nudge { animation: hintNudge 2.4s ease-in-out infinite; }
@keyframes hintNudge {
  0%, 100% { transform: translateX(-50%); }
  45%       { transform: translateX(calc(-50% + 5px)); }
  55%       { transform: translateX(calc(-50% + 5px)); }
}

/* ── PAGE 1 · COVER ── */
.p-cover { justify-content: flex-end; }
.p-cover .img-zone {
  position: absolute; inset: 0 0 34% 0; overflow: hidden;
}
.p-cover .img-zone img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center 16%;
  display: block;
  animation: coverImg 1.15s cubic-bezier(.16,1,.3,1) .3s both;
}
@keyframes coverImg {
  from { opacity:0; transform: scale(1.06); }
  to   { opacity:1; transform: none; }
}
.p-cover .img-zone::after {
  content: ""; position: absolute;
  bottom: 0; left: 0; right: 0; height: 80px;
  background: linear-gradient(to bottom, transparent, var(--ivory));
}
.p-cover .txt-zone {
  position: relative; z-index: 2;
  min-height: 34%;
  padding: 18px 28px 26px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; text-align: center;
  background: var(--ivory);
  animation: coverTxt .7s cubic-bezier(.16,1,.3,1) .62s both;
}
@keyframes coverTxt {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: none; }
}
.p-cover .c-name {
  font-family: var(--serif); font-size: 15px; font-weight: 400;
  color: var(--muted); letter-spacing: .04em;
}
.p-cover .c-title {
  font-family: var(--serif);
  font-size: clamp(26px,7vw,33px); font-weight: 500;
  line-height: 1.07; letter-spacing: -.02em; color: var(--ink);
}

/* ── PAGE 2 · MINIMAL ── */
.p-minimal {
  align-items: center; justify-content: center;
  padding: 44px 34px; text-align: center; gap: 18px;
}
.p-minimal .accent { font-size: 17px; color: var(--dusty); letter-spacing: .1em; }
.p-minimal .m-text {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(20px,5.6vw,26px); font-weight: 400;
  line-height: 1.50; letter-spacing: -.01em; color: var(--ink);
  max-width: 268px;
}
.p-minimal .m-sub {
  font-family: var(--serif); font-size: clamp(14px,3.7vw,16px);
  font-weight: 400; color: var(--muted);
  letter-spacing: 0; line-height: 1.5;
}

/* ── PAGE 3 · EDITORIAL ── */
.p-editorial {
  padding: 46px 30px 42px;
  justify-content: center;
}
.p-editorial .e-para {
  max-width: 315px;
  margin: 0 auto 20px;
  font-family: var(--serif);
  font-size: clamp(17px,4.7vw,20px);
  font-weight: 400;
  font-style: normal;
  line-height: 1.58;
  letter-spacing: -.012em;
  color: var(--ink);
  text-align: center;
}
.p-editorial .e-para:last-child {
  margin-bottom: 0;
}
.p-editorial .e-para.warm {
  color: var(--ink2);
  margin-top: 3px;
}

/* ── PAGE 4 · QUOTE ── */
.p-quote {
  align-items: center; justify-content: center;
  padding: 36px 30px; text-align: center; gap: 28px;
}
.p-quote .q-line { width: 28px; height: 1px; background: var(--rose); opacity: .5; }
.p-quote .q-text {
  font-family: var(--serif); font-style: italic;
  font-size: clamp(24px,7vw,34px); font-weight: 400;
  line-height: 1.32; letter-spacing: -.015em;
  color: var(--wine); max-width: 290px;
}

/* ── PAGE 4 · PERSONAL ── */
.p-personal {
  padding: 44px 30px 78px;
  justify-content: center;
  text-align: center;
}
.p-personal .personal-main {
  width: min(100%, 318px);
  margin: 0 auto;
}
.p-personal .p-line {
  margin: 0 auto;
  font-family: var(--serif);
  font-size: clamp(18px, 4.9vw, 21px);
  font-weight: 400;
  font-style: normal;
  line-height: 1.52;
  letter-spacing: -.012em;
  color: var(--ink);
}
.p-personal .p-line.lg {
  font-size: clamp(22px, 6vw, 27px);
  line-height: 1.30;
  color: var(--wine);
}
.p-personal .p-line.md {
  color: var(--ink2);
}
.p-personal .p-gap {
  height: 30px;
  position: relative;
}
.p-personal .p-gap::after {
  content: "✦";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  font-family: var(--sans);
  font-size: 9px;
  color: var(--dusty);
  opacity: .55;
}
/* ── PAGE 6 · MEME ── */
.p-meme {
  align-items: center; justify-content: center;
  padding: 28px 22px 22px; gap: 16px;
}
.p-meme .m-img {
  flex: 1; min-height: 0; width: 100%;
  display: flex; align-items: center; justify-content: center;
}
.p-meme .m-img img {
  max-width: 100%; max-height: 100%; width: auto; height: auto;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(28,8,14,.13);
  display: block;
}
.p-meme .m-cap {
  font-family: var(--serif); font-size: clamp(14px,3.7vw,16px);
  font-weight: 400; color: var(--muted);
  text-align: center; line-height: 1.55; max-width: 270px;
}

/* ── PAGE 7 · FINAL ── */
.p-final {
  align-items: center; justify-content: center;
  text-align: center; padding: 36px 28px 44px; gap: 0;
}
.p-final.f-wish {
  font-family: var(--serif);
  font-size: clamp(28px,8vw,38px); font-weight: 500;
  line-height: 1.07; letter-spacing: -.02em;
  color: var(--ink); margin-bottom: 10px;
}
.p-final .f-emoji {
  font-size: clamp(28px,8vw,38px); line-height: 1;
  display: block; margin-bottom: 54px;
}
.p-final.page-enter .f-emoji {
  /* riseIn from stagger, then continuous gentle pulse */
  animation: riseIn .55s cubic-bezier(.16,1,.3,1) .12s both,
             heartbeat 3.6s ease-in-out 1.4s infinite;
}
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.08); }
}
.p-final .f-sig {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom,0px) + 16px);
  font-family: var(--sans); font-size: 9px; font-weight: 300;
  letter-spacing: .16em; text-transform: none;
  color: var(--dusty); opacity: .72;
}

/* ── CONTENT ENTRANCE ── */
.page-enter > * {
  animation: riseIn .55s cubic-bezier(.16,1,.3,1) both;
}
.page-enter > *:nth-child(1) { animation-delay: .05s; }
.page-enter > *:nth-child(2) { animation-delay: .13s; }
.page-enter > *:nth-child(3) { animation-delay: .21s; }
.page-enter > *:nth-child(4) { animation-delay: .29s; }
.page-enter > *:nth-child(5) { animation-delay: .37s; }
.page-enter > *:nth-child(6) { animation-delay: .45s; }
@keyframes riseIn {
  from { opacity:0; transform: translateY(12px); filter: blur(2px); }
  to   { opacity:1; transform: none; filter: none; }
}

/* ── REDUCED MOTION ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

.f-sig{
  position:absolute;
  right:18px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  left:auto;
  margin:0;
  text-align:right;
  text-transform:none;
  font-size:10px;
  line-height:1;
  letter-spacing:.08em;
  opacity:.55;
  white-space:nowrap;
}

</style>

<style>
/* final visual polish */
.p-editorial .e-para.warm { margin-top: 2px; }
.p-final { padding-bottom: 74px; }
.p-final .f-wish { font-family: var(--serif); font-style: normal; font-weight: 400; }
.p-final .f-emoji { font-family: var(--sans); }
.p-meme { justify-content:center; padding:54px 24px 72px; gap:14px; }
.p-meme .meme-intro { font-family:var(--serif); font-size:15px; color:var(--muted); letter-spacing:.02em; text-align:center; }
.p-meme .m-cap { margin-top:2px; max-width:285px; }
.p-personal { padding-left:28px; padding-right:28px; }
.p-personal .personal-main { max-width:310px; }
</style>
</head>
<body>

<div id="card">
  <div id="pages"></div>
  <div id="flip-shadow"></div>
  <div class="nav-tap" id="nav-prev"></div>
  <div class="nav-tap" id="nav-next"></div>
  <div class="nav-arr" id="arr-prev">&#8592;</div>
  <div class="nav-arr" id="arr-next">&#8594;</div>
  <div id="dots"></div>
  <div id="hint">листай&nbsp;&#8594;</div>

/* ── RENDERERS ── */
const R = {
  cover()   { return `<div class="img-zone"><img src="${IMGS.cat}" alt=""></div>
                      <div class="txt-zone">
                        <span class="c-name">Натали,</span>
                        <span class="c-title">С днём рождения</span>
                      </div>`; },
  minimal(p){ const sub = p.sub ? `<p class="m-sub">${p.sub}</p>` : '';
              return `<span class="accent">${p.accent}</span>
                      <p class="m-text">${p.text}</p>${sub}`; },
  editorial(p){ const ps = p.paras.map(q=>`<p class="e-para ${q.cls}">${q.text}</p>`).join('');
                return ps; },
  quote(p)  { return `<div class="q-line"></div>
                      <p class="q-text">${p.text}</p>
                      <div class="q-line"></div>`; },
  personal(p){ return `<div class="personal-main">${p.lines.map(l=>l===null?'<div class="p-gap"></div>'
                :`<p class="p-line ${l.size}">${l.text}</p>`).join('')}</div>`; },
  meme(p)   { return `<div class="m-img"><img src="${IMGS[p.image]}" alt=""></div>
                      <p class="m-cap">${p.caption}</p>`; },
  final(p)  { return `<p class="f-wish">${p.wish}</p>
                      <p class="f-emoji">${p.emoji}</p>
                      <span class="f-sig">${p.sig}</span>`; },
};

function buildPage(data, i) {
  const el = document.createElement('div');
  el.className = `page bg-${data.bg} p-${data.type}`;
  el.innerHTML = R[data.type](data);
  return el;
}

/* ── BOOK ── */
class Book {
  constructor() {
    this.cur   = 0;
    this.total = PAGES.length;
    this.busy  = false;
    this.els   = [];
    this.dots  = [];

    this.card    = document.getElementById('card');
    this.pagesEl = document.getElementById('pages');
    this.shadow  = document.getElementById('flip-shadow');
    this.hint    = document.getElementById('hint');
    this.dotsEl  = document.getElementById('dots');
    this.aP      = document.getElementById('arr-prev');
    this.aN      = document.getElementById('arr-next');

    this.drag = { on:false, startX:0, startY:0, t0:0, dx:0, axis:null };

    this._build();
    this._place(false);
    this._nav();
    this._bind();
  }

  _build() {
    PAGES.forEach((p, i) => {
      const el = buildPage(p, i);
      this.pagesEl.appendChild(el);
      this.els.push(el);

      /* Page dot */
      const d = document.createElement('span');
      d.className = 'dot' + (i===0 ? ' active' : '');
      d.addEventListener('click', () => this.goTo(i));
      this.dotsEl.appendChild(d);
      this.dots.push(d);
    });
  }

  /* Position all pages relative to current */
  _place(animate, snapBack) {
    const W = this.card.offsetWidth;
    const ease = snapBack
      ? 'transform .38s cubic-bezier(.34,1.28,.64,1)' /* spring snap-back */
      : 'transform .42s cubic-bezier(.16,1,.3,1)';    /* smooth navigate  */

    this.els.forEach((el, i) => {
      const d = i - this.cur;
      const x = d===0 ? 0 : d<0 ? -(W+1) : (W+1);
      el.style.transition = animate ? ease : 'none';
      el.style.transform  = `translateX(${x}px) scale(1)`;
      el.style.zIndex     = d===0 ? 10 : Math.abs(d)===1 ? 5 : 1;
      el.style.visibility = Math.abs(d)<=1 ? 'visible' : 'hidden';
    });
  }

  _nav() {
    const first = this.cur === 0;
    const last  = this.cur === this.total - 1;
    this.hint.style.opacity = first ? '1' : '0';
    this.hint.classList.toggle('nudge', first);
    this.aP.style.opacity   = first ? '0' : '1';
    this.aN.style.opacity   = (first || last) ? '0' : '1';
    this.dots.forEach((d, i) => d.classList.toggle('active', i===this.cur));
  }

  /* Staggered content entrance (skip cover - it has its own CSS animation) */
  _enter(idx) {
    if (idx === 0) return;
    const el = this.els[idx];
    el.classList.remove('page-enter');
    void el.offsetWidth;
    el.classList.add('page-enter');
  }

  goTo(idx) {
    if (this.busy || idx<0 || idx>=this.total || idx===this.cur) return;
    this.busy = true;
    this.cur  = idx;
    this._enter(idx);
    this._place(true, false);
    this._nav();
    this.shadow.style.transition = 'opacity .42s cubic-bezier(.16,1,.3,1)';
    this.shadow.style.opacity    = '0';
    setTimeout(() => { this.busy=false; this.shadow.style.transition=''; }, 460);
  }

  /* Live drag with depth scale */
  _rawDrag(dx) {
    const W   = this.card.offsetWidth;
    const atL = this.cur===0 && dx>0;
    const atR = this.cur===this.total-1 && dx<0;
    const rdx = (atL||atR) ? dx*.16 : dx;

    const prog     = Math.min(Math.abs(rdx)/W, 1);
    const curScale = 1 - prog*.025;      /* current page: 1 → .975  */
    const adjScale = .975 + prog*.025;   /* adjacent:   .975 → 1    */

    this.els[this.cur].style.transform = `translateX(${rdx}px) scale(${curScale})`;

    if (dx<0 && this.cur+1 < this.total) {
      const nx = this.els[this.cur+1];
      nx.style.transform  = `translateX(${W+rdx}px) scale(${adjScale})`;
      nx.style.visibility = 'visible';
    } else if (dx>0 && this.cur>0) {
      const pv = this.els[this.cur-1];
      pv.style.transform  = `translateX(${-W+rdx}px) scale(${adjScale})`;
      pv.style.visibility = 'visible';
    }

    this.shadow.style.opacity = Math.min(prog, 1) * .60;
  }

  _commit(dx, vel) {
    const W   = this.card.offsetWidth;
    const rat = Math.abs(dx)/W;
    const go  = rat>.28 || Math.abs(vel)>.30;

    if (dx<0 && go && this.cur<this.total-1) {
      this.goTo(this.cur+1);
    } else if (dx>0 && go && this.cur>0) {
      this.goTo(this.cur-1);
    } else {
      /* Spring snap-back */
      this._place(true, true);
      this.shadow.style.transition = 'opacity .35s ease';
      this.shadow.style.opacity    = '0';
      setTimeout(() => { this.shadow.style.transition=''; }, 380);
    }
  }

  _bind() {
    const c = this.card;

    c.addEventListener('touchstart', e => {
      if (this.busy) return;
      const t = e.touches[0];
      this.drag = { on:true, startX:t.clientX, startY:t.clientY, t0:Date.now(), dx:0, axis:null };
      this.els.forEach(el => el.style.transition='none');
      this.shadow.style.transition = 'none';
      this.card.classList.add('dragging');
    }, { passive:true });

    c.addEventListener('touchmove', e => {
      if (!this.drag.on || this.busy) return;
      const t  = e.touches[0];
      const dx = t.clientX - this.drag.startX;
      const dy = t.clientY - this.drag.startY;

      if (this.drag.axis===null && (Math.abs(dx)>5 || Math.abs(dy)>5))
        this.drag.axis = Math.abs(dx)>=Math.abs(dy) ? 'h' : 'v';

      if (this.drag.axis==='v') { this.drag.on=false; return; }
      if (this.drag.axis==='h') {
        if (e.cancelable) e.preventDefault();
        this.drag.dx = dx;
        this._rawDrag(dx);
      }
    }, { passive:false });

    const onEnd = () => {
      if (!this.drag.on) return;
      this.drag.on = false;
      this.card.classList.remove('dragging');
      const dt  = Math.max(Date.now()-this.drag.t0, 1);
      const vel = this.drag.dx/dt;
      this._commit(this.drag.dx, vel);
    };
    c.addEventListener('touchend',    onEnd, { passive:true });
    c.addEventListener('touchcancel', onEnd, { passive:true });

    document.getElementById('nav-prev').addEventListener('click', () => this.goTo(this.cur-1));
    document.getElementById('nav-next').addEventListener('click', () => this.goTo(this.cur+1));
    document.addEventListener('keydown', e => {
      if (e.key==='ArrowRight') this.goTo(this.cur+1);
      if (e.key==='ArrowLeft')  this.goTo(this.cur-1);
    });
  }
}

document.addEventListener('DOMContentLoaded', () => new Book());
</script>
</body>
</html>
